<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Masuk · Monolife</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="grid min-h-screen lg:grid-cols-2">
      <section class="hidden flex-col justify-between bg-black p-12 text-white lg:flex">
        <div class="flex items-center gap-3">
          <span class="inline-flex size-9 items-center justify-center rounded-lg bg-white">
            <span class="size-3.5 rounded-full bg-black"></span>
          </span>
          <span class="text-lg font-semibold tracking-tight">Monolife</span>
        </div>
        <div>
          <p class="max-w-sm text-3xl font-semibold leading-tight tracking-tight">
            Catat uang, jaga kebiasaan, capai tujuan.
          </p>
          <p class="mt-4 max-w-sm text-sm text-neutral-400">
            Satu tempat sederhana untuk mengelola keuangan dan target harianmu.
          </p>
        </div>
        <p class="text-xs text-neutral-500">Berjalan penuh offline di komputermu sendiri.</p>
      </section>

      <section class="flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-sm">
          <div class="mb-8 flex items-center gap-3 lg:hidden">
            <span class="inline-flex size-9 items-center justify-center rounded-lg bg-black">
              <span class="size-3.5 rounded-full bg-white"></span>
            </span>
            <span class="text-lg font-semibold tracking-tight">Monolife</span>
          </div>

          <h1 id="heading" class="page-title">Masuk</h1>
          <p id="subheading" class="page-sub">Selamat datang kembali.</p>

          <div class="mt-6 grid grid-cols-2 rounded-lg bg-neutral-100 p-1 text-sm font-medium" role="tablist">
            <button type="button" data-mode="login" class="rounded-md px-3 py-2 transition">Masuk</button>
            <button type="button" data-mode="register" class="rounded-md px-3 py-2 transition">Daftar</button>
          </div>

          <form id="form" class="mt-6 space-y-4" novalidate>
            <div>
              <label for="username" class="label">Username</label>
              <input id="username" name="username" class="input" autocomplete="username" required />
            </div>
            <div>
              <label for="password" class="label">Password</label>
              <input id="password" name="password" type="password" class="input" autocomplete="current-password" required />
              <p id="hint" class="mt-1.5 hidden text-xs text-neutral-500">Minimal 8 karakter, mengandung huruf dan angka.</p>
            </div>
            <p id="error" class="hidden rounded-lg border border-neutral-300 bg-neutral-50 px-3.5 py-2.5 text-sm text-neutral-800" role="alert"></p>
            <button id="submit" type="submit" class="btn-primary w-full">Masuk</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
